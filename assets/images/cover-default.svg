<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The cover of a track without one of its own: the HMI's indigo, a record's grooves, a note -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#A21CAF"/>
    </linearGradient>
    <radialGradient id="glow" cx="170" cy="150" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" fill="url(#glow)"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6">
    <circle cx="256" cy="256" r="200"/>
    <circle cx="256" cy="256" r="160"/>
    <circle cx="256" cy="256" r="120"/>
  </g>
  <g fill="#F1EEFF">
    <polygon points="206,150 346,120 346,156 206,186"/>
    <rect x="206" y="150" width="18" height="190"/>
    <rect x="328" y="120" width="18" height="190"/>
    <ellipse cx="190" cy="342" rx="40" ry="30" transform="rotate(-20 190 342)"/>
    <ellipse cx="312" cy="312" rx="40" ry="30" transform="rotate(-20 312 312)"/>
  </g>
</svg>
