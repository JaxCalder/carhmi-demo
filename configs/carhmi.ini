; carhmi.ini - libsystemd unit: shows the car HMI on the first display while
; it runs (it waits for dmview to register the display and for the view -
; on a card - to be mounted).
;
; The view is found: the one built into the firmware
; (/eviews/carhmi_view/carhmi.dmv), else the one carhmi_view puts on the SD
; card (dmod-boot's sdcard.dmd) - views/carhmi_view/carhmi.dmv on any card
; automount mounted (/mnt/<label>, or /mnt/<node name> without one). Give a
; path as the first argument (args=) to show another.
description=Car HMI demo
exec=carhmi
type=simple
