; carhmi.ini - libsystemd unit: shows the car HMI on the first display while
; it runs (it waits for dmview to register the display and for the view -
; on a card - to be mounted).
;
; The view is the one carhmi_view puts on the SD card (dmod-boot's
; sdcard.dmd), mounted by automount at /mnt/<label> or /mnt/<node name> -
; the first partition of the board's SD slot is /mnt/dmsdio0_0p1. Give
; another path as the first argument, e.g. /eviews/carhmi_view/carhmi.dmv
; for a view built into the firmware.
description=Car HMI demo
exec=carhmi
args=/mnt/dmsdio0_0p1/views/carhmi_view/carhmi.dmv
type=simple
